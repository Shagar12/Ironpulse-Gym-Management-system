<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <!-- Glowing Twin Bars & Bolt -->
  <g filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="140" y="240" width="232" height="32" rx="16" fill="url(#neonGrad)"/>
    <!-- Left Weights -->
    <rect x="100" y="160" width="30" height="192" rx="12" fill="#00f3ff"/>
    <rect x="70" y="190" width="24" height="132" rx="8" fill="#00f3ff" opacity="0.8"/>
    <!-- Right Weights -->
    <rect x="382" y="160" width="30" height="192" rx="12" fill="#b026ff"/>
    <rect x="418" y="190" width="24" height="132" rx="8" fill="#b026ff" opacity="0.8"/>
    <!-- Center Bolt -->
    <path d="M275 140 L225 250 L260 250 L235 372 L300 255 L262 255 Z" fill="#ffffff" stroke="#00f3ff" stroke-width="3"/>
  </g>
  <text x="256" y="440" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="4">IRONPULSE</text>
</svg>
